name: E2E

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/server.js'
      - 'src/db.js'
      - 'test/e2e/**'
      - 'playwright.config.js'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build browser extension
        run: npm run build:extension

      - name: Build local ZK browser dependencies
        run: npm run build:poseidon

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: 'true'
          NODE_ENV: test
