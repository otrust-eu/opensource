# OTRUST production self-host in one command:
#   ADMIN_KEY=$(openssl rand -hex 32) AUTH_SECRET=$(openssl rand -hex 32) docker compose up -d --build

services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - OTRUST_DB_PATH=/app/data/otrust.sqlite
      - ADMIN_KEY=${ADMIN_KEY:-}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - BASE_URL=${BASE_URL:-http://localhost:3000}
    volumes:
      - otrust_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  otrust_data:
